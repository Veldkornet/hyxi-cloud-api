name: API Tests

# Run on pushes and PRs to main/master
on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # uv reads this on every `uv run`/`uv sync` invocation below, so it's
      # set once here rather than repeating `--locked` on each `run:` line --
      # fail fast on lockfile drift instead of silently resolving/installing
      # an unlocked version.
      UV_LOCKED: "1"
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            files.pythonhosted.org:443
            ghcr.io:443
            github.com:443
            objects.githubusercontent.com:443
            pypi.org:443
            raw.githubusercontent.com:443
            release-assets.githubusercontent.com:443

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: '3.14'
          enable-cache: true
          # cache-python defaults to false -- without it, every run
          # re-downloads the full CPython interpreter tarball from GitHub's
          # release CDN, which is a large, single point of flaky-network
          # failure repeated on every job instead of paid for once.
          cache-python: true

      - name: Install dependencies
        # Split in two: third-party dependencies are installed with
        # --no-build (refuse to build any of them from a source
        # distribution, which would otherwise execute that package's own
        # build-backend code) and --no-install-project (skip the local
        # package for now). The local project is then installed separately,
        # without --no-build, since it's trusted first-party code that
        # *always* needs building for an editable install -- unlike a
        # third-party sdist, there's no supply-chain risk in running our
        # own build backend on our own checkout.
        run: |
          uv sync --extra test --no-build --no-install-project
          uv sync --extra test

      - name: Run Pytest
        run: uv run pytest tests/ -v -p no:warnings --cov --cov-report=

      - name: Check coverage
        # This is a floor, not a target -- if it ever fails, the fix is new
        # tests for whatever went uncovered, not lowering the threshold.
        run: uv run coverage report -m --fail-under=100
