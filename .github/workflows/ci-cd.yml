name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  release:
    types: [published]

# 🛑 1. Baseline: No global permissions
permissions:
  contents: none

jobs:
  security:
    name: Security Scan (CodeQL)
    runs-on: ubuntu-latest
    permissions:
      contents: read       # To scan code
      security-events: write # To upload CodeQL results
      actions: read        # Required for CodeQL internal metadata
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@fa2e9d605c4eeb9fcad4c99c224cee0c6c7f3594 # v2.16.0
        with:
          egress-policy: audit

      - name: 📥 Checkout Code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: 🛠️ Initialize CodeQL
        uses: github/codeql-action/init@b1bff81932f5cdfc8695c7752dcee935dcd061c8 # v4.33.0
        with:
          languages: python
          build-mode: none

      - name: 🔍 Perform Analysis
        uses: github/codeql-action/analyze@b1bff81932f5cdfc8695c7752dcee935dcd061c8 # v4.33.0

  publish:
    name: Build and Publish to PyPI
    needs: [security]
    if: github.event_name == 'release' && github.event.action == 'published'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/hyxi-cloud-api
    permissions:
      contents: write # To modify pyproject.toml and build
      id-token: write # REQUIRED for Trusted Publishing (OIDC) to PyPI
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@fa2e9d605c4eeb9fcad4c99c224cee0c6c7f3594 # v2.16.0
        with:
          egress-policy: audit

      - name: 📥 Checkout Code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: 🐍 Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.14"

      - name: 🏗️ Inject Version & Build
        run: |
          TAG_NAME="${{ github.event.release.tag_name }}"
          CLEAN_VERSION="${TAG_NAME#v}"

          echo "Injecting version $CLEAN_VERSION into pyproject.toml..."
          sed -i "s/^version = .*/version = \"$CLEAN_VERSION\"/" pyproject.toml

          echo "--- VERIFYING FILE CONTENTS ---"
          grep "^version" pyproject.toml
          echo "-------------------------------"

          pipx run build

      - name: 🚀 Publish to PyPI
        # Using OIDC for passwordless publishing
        uses: pypa/gh-action-pypi-publish@ed0c53931b1dc9bd32cbe73a98c7f6766f8a527e # v1.13.0
        with:
          attestations: true
