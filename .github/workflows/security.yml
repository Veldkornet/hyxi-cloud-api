name: "Security Shield"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '30 4 * * 1'

# 🛑 1. Baseline: No permissions at the global level
permissions:
  contents: none

jobs:
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    # ✅ 2. Specific permissions for scanning and reporting
    permissions:
      contents: read       # To scan the code
      security-events: write # To upload results to the Security tab

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@fe104658747b27e96e4f7e80cd0a94068e53901d # v2.16.1
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            files.pythonhosted.org:443
            fulcio.sigstore.dev:443
            ghcr.io:443
            github.com:443
            objects.githubusercontent.com:443
            pkg-containers.githubusercontent.com:443
            pypi.org:443
            rekor.sigstore.dev:443
            release-assets.githubusercontent.com:443
            results-receiver.actions.githubusercontent.com:443
            tuf-repo-cdn.sigstore.dev:443
            uploads.github.com:443
            codeload.github.com:443
            actions-results-receiver-production.githubapp.com:443
            productionresultssa12.blob.core.windows.net:443
            release-assets.githubusercontent.com:443

      - name: Checkout Code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Gitleaks (Secret Scan)
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Bandit (Python Security)
        run: |
          pipx run --spec "bandit[sarif]" bandit -r src/ -ll -f sarif -o bandit-results.sarif

      - name: Upload Bandit Results
        uses: github/codeql-action/upload-sarif@38697555549f1db7851b81482ff19f1fa5c4fedc # v4.34.1
        if: always()
        with:
          sarif_file: bandit-results.sarif

  dependency-review:
    name: Dependency Review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    # ✅ 3. This job only needs to read the dependency files
    permissions:
      contents: read

    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@fe104658747b27e96e4f7e80cd0a94068e53901d # v2.16.1
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            files.pythonhosted.org:443
            fulcio.sigstore.dev:443
            ghcr.io:443
            github.com:443
            objects.githubusercontent.com:443
            pkg-containers.githubusercontent.com:443
            pypi.org:443
            rekor.sigstore.dev:443
            release-assets.githubusercontent.com:443
            results-receiver.actions.githubusercontent.com:443
            tuf-repo-cdn.sigstore.dev:443
            uploads.github.com:443
            codeload.github.com:443
            actions-results-receiver-production.githubapp.com:443
            productionresultssa12.blob.core.windows.net:443

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Review Dependencies
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0
