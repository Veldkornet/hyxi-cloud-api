version: 2
updates:
  # Keep Python dependencies (pyproject.toml + uv.lock) updated
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"

  # Keep GitHub Actions updated
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    # Minor and patch bumps share one PR so they can't conflict on workflow files; major bumps get their own.
    groups:
      actions:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
