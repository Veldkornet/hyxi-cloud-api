version: 2
updates:
  # Keep Python dependencies (pyproject.toml + uv.lock) updated
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"

  # Keep GitHub Actions updated
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      codeql:
        patterns:
          - "github/codeql-action*"
