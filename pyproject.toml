[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hyxi-cloud-api"
dynamic = ["version"]
authors = [
  { name="Veldkornet", email="Veldkornet@users.noreply.github.com" },
]
description = "An async API client for HYXi Cloud."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "aiohttp>=3.13.5",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Home Automation",
]

[project.optional-dependencies]
test = [
    "pytest>=9.0.3",
    "pytest-asyncio",
    "hypothesis>=6.100.0",
    "pytest-cov>=5.0.0",
    "pre-commit>=4.0.0",
]

[tool.setuptools.dynamic]
# hyxi_cloud_api/__init__.py is the single source of truth for the package version.
version = { attr = "hyxi_cloud_api.__version__" }

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "S",   # flake8-bandit (security)
    "N",   # pep8-naming
    "PTH", # flake8-use-pathlib
    "RUF", # ruff-internal rules
]
ignore = ["E501", "N818", "S105"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106", "N802", "E402"]
"/hyxi_cloud/__init__.py" = ["N812"]

[tool.mypy]
python_version = "3.14"
show_error_codes = true
incremental = true
ignore_missing_imports = true
explicit_package_bases = true
mypy_path = "src"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.vulture]
paths = ["src"]
min_confidence = 80

[tool.pylint.messages_control]
disable = ["broad-exception-caught", "too-many-locals", "too-many-return-statements", "too-many-branches", "too-few-public-methods", "protected-access", "unused-argument", "duplicate-code", "import-error", "wrong-import-position", "reimported", "missing-module-docstring", "ungrouped-imports", "redefined-outer-name", "missing-class-docstring"]

[tool.pylint.format]
max-line-length = 120
