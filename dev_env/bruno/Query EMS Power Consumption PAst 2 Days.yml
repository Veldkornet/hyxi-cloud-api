info:
  name: Query EMS Power Consumption PAst 2 Days
  type: http
  seq: 10

http:
  method: GET
  url: "{{base_url}}//api/ems/v1/queryEmsPlantPowerContrast?plantId={{active_plant_id}}"
  params:
    - name: plantId
      value: "{{active_plant_id}}"
      type: query
  body:
    type: json
    data: "\n"
  auth:
    type: bearer
    token: "{{token}}"

runtime:
  scripts:
    - type: before-request
      code: |-
        const crypto = require('crypto-js');

        const getVar = (name) => bru.getEnvVar(name) || bru.getVar(name);
        const accessKey = getVar("access_key");
        const secretKey = getVar("secret_key");
        const token = getVar("token");

        if (!token) {
            throw new Error("No token found! Run the 'Get Token' request first.");
        }

        const path = "/api/ems/v1/queryEmsPlantPowerContrast";
        const method = "GET";
        const timestamp = Date.now().toString();
        const nonce = timestamp.toString(16).slice(-8);

        // For GET requests, content hash is the hash of an empty string
        const hexContentHash = crypto.SHA512("").toString(crypto.enc.Hex);

        // IMPORTANT: Per your Python code, for data calls,
        // the token is injected into the signString calculation
        const stringToSign = `${path}\n${method}\n${hexContentHash}\n`;
        const signString = `${accessKey}${token}${timestamp}${nonce}${stringToSign}`;

        const hmac = crypto.HmacSHA512(signString, secretKey);
        const signature = crypto.enc.Base64.stringify(hmac);

        // Set Headers
        req.setHeader("AccessKey", accessKey);
        req.setHeader("Timestamp", timestamp);
        req.setHeader("Nonce", nonce);
        req.setHeader("Sign", signature);
        req.setHeader("Authorization", token);

        console.log(`Querying device: ${getVar("device_sn")}`);
    - type: after-response
      code: |-
        const response = res.getBody();

        if (response.success && response.data && response.data.deviceList) {
            const devices = response.data.deviceList;

            // Find the device that is a Hybrid Inverter
            const inverter = devices.find(d => d.deviceType === "HYBRID_INVERTER");

            if (inverter) {
                bru.setVar("active_device_sn", inverter.deviceSn);
                console.log("Success! Saved Inverter SN: " + inverter.deviceSn);
            } else {
                // Fallback: If no Hybrid Inverter, take the first device
                bru.setVar("active_device_sn", devices[0].deviceSn);
                console.log("Warning: No Hybrid found, saved first device SN: " + devices[0].deviceSn);
            }
        } else {
            console.log("Error: Response structure did not contain deviceList.");
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
