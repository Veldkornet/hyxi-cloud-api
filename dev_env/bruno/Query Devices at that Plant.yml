info:
  name: Query Devices at that Plant
  type: http
  seq: 4

http:
  method: POST
  url: "{{base_url}}/api/plant/v1/devicePage"
  body:
    type: json
    data: |-
      {
        "plantId": "{{active_plant_id}}",
        "pageSize": 20,
        "currentPage": 1
      }
  auth:
    type: bearer
    token: "{{token}}"

runtime:
  scripts:
    - type: before-request
      code: |-
        const crypto = require("crypto-js");

        // 1. Setup variables
        const timestamp = Date.now().toString();
        const nonce = Math.random().toString(16).substring(2, 10);
        const method = "POST";
        const path = "/api/plant/v1/devicePage";
        const signHeaderKeys = ""; // As per your Java example

        const getVar = (name) => bru.getEnvVar(name) || bru.getVar(name);
        const accessKey = getVar("access_key");
        const secretKey = getVar("secret_key");
        let token = getVar("token");

        if (token && !token.startsWith("Bearer ")) {
            token = "Bearer " + token;
        }

        // 2. Handle the "Sign-headers" content logic (MATCHING JAVA EXACTLY)
        let contentStr = ""; // Default to empty string if signHeaderKeys is empty

        // 3. DigestUtil.sha512Hex() of the EMPTY string
        const hexContentHash = crypto.SHA512(contentStr).toString(crypto.enc.Hex);

        // 4. Build stringToSign: {uri}\n{method}\n{hexContentHash}\n
        const stringToSign = `${path}\n${method}\n${hexContentHash}\n`;

        // 5. Build signString: {accessKey}{token}{timestamp}{nonce}{stringToSign}
        const signString = `${accessKey}${token}${timestamp}${nonce}${stringToSign}`;

        // 6. HMAC-SHA512 and Base64
        const hash = crypto.HmacSHA512(signString, secretKey);
        const signature = crypto.enc.Base64.stringify(hash);

        // 7. Set Headers
        req.setHeader("timestamp", timestamp);
        req.setHeader("nonce", nonce);
        req.setHeader("sign", signature);
        req.setHeader("accessKey", accessKey);
        req.setHeader("Authorization", token);
        req.setHeader("Sign-headers", signHeaderKeys);
        req.setHeader("Content-Type", "application/json;charset=utf-8");
    - type: after-response
      code: |-
        const response = res.getBody();

        if (response.success && response.data && response.data.deviceList) {
            const devices = response.data.deviceList;

            if (devices.length > 0) {
                // Generic default — first device in the list, no type bias
                bru.setVar("active_device_sn", devices[0].deviceSn);
                console.log("Saved active_device_sn (first device): " + devices[0].deviceSn);
            }

            // Save every device's SN keyed by its own deviceType, e.g.
            // {{device_sn_HYBRID_INVERTER}}, {{device_sn_EMS}} — whatever
            // types actually exist in this account. If there are multiple
            // devices of the same type, the last one found wins.
            devices.forEach(d => {
                const type = (d.deviceType || "unknown").toUpperCase().replace(/[^A-Z0-9]/g, "_");
                const varName = `device_sn_${type}`;
                bru.setVar(varName, d.deviceSn);
                console.log(`Saved ${varName} = ${d.deviceSn}`);
            });

            console.log("Full device list:", JSON.stringify(devices.map(d => ({ sn: d.deviceSn, type: d.deviceType }))));
        } else {
            console.log("Error: Response structure did not contain deviceList.");
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
